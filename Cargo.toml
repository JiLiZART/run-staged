[workspace]
  members  = ["apps/*", "crates/*"]
  resolver = "2"

  [workspace.package]
    edition      = "2024"
    license      = "MIT"
    rust-version = "1.88"
    version      = "0.1.0"

  [workspace.dependencies]
    clap           = { version = "4", features = ["derive"] }
    gix            = "0.81"
    fancy-regex    = "0.19"
    globset        = "0.4"
    libc           = "0.2"
    nix            = { version = "0.31", features = ["signal"] }
    parse_duration = "2"
    ratatui        = "0.30"
    serde          = { version = "1", features = ["derive"] }
    serde-saphyr   = "1.3"
    serde_json     = { version = "1", features = ["preserve_order"] }
    shlex          = "1.3"
    thiserror      = "2"
    tokio          = { version = "1", features = ["full"] }
    toml           = { version = "1", features = ["preserve_order"] }
    unicode-width  = "0.2"

    run-staged-config  = { path = "crates/config", version = "0.1.0" }
    run-staged-core    = { path = "crates/core", version = "0.1.0" }
    run-staged-exec    = { path = "crates/exec", version = "0.1.0" }
    run-staged-git     = { path = "crates/git", version = "0.1.0" }
    run-staged-matcher = { path = "crates/matcher", version = "0.1.0" }
    run-staged-output  = { path = "crates/output", version = "0.1.0" }
    run-staged-tui     = { path = "crates/tui", version = "0.1.0" }

[profile.dev]
  incremental = true # Compile your binary in smaller steps.

[profile.release]
  codegen-units = 1      # Allows LLVM to perform better optimization.
  lto           = true   # Enables link-time-optimizations.
  opt-level     = "z"    # Optimize for size.
  panic         = "abort" # Higher performance by disabling panic handlers.
  strip         = true   # Ensures debug symbols are removed.
